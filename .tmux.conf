##### Terminal / Colors #####
set -g default-terminal "tmux-256color"
set -a terminal-features "tmux-256color:RGB"

##### Prefix #####
unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### Indexing / Behavior #####
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g mouse on
set -g set-clipboard on
set -sg escape-time 0

##### Status Bar #####
set -g status-position top
set -g status-justify right
set -g status-style "bg=default"
set -g window-status-current-style "fg=black bg=white"
set -g status-interval 5
set -g status-left "#S"
set -g status-right ""

##### Reload #####
bind r source-file ~/.tmux.conf \; display-message "reloaded ~/.tmux.conf"

##### Core tmux defaults you expect #####
bind c new-window
bind n next-window
bind p previous-window
bind w choose-tree

# splits (you asked for these)
bind % split-window -h
bind '"' split-window -v

# resize (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vi-ish pane navigation (kept from your config)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### No-prefix key #####
bind-key -n M-BSpace send-keys C-w

##### Your scripts / launchers #####
bind f run-shell "tmux new-window ~/.config/scripts/tmux-session-dispensary.sh"
bind g run-shell "~/.config/scripts/open-github.sh"
bind t run-shell "tmux new-window ~/.config/scripts/time.sh"

bind N run-shell "~/.config/scripts/tmux-session-dispensary.sh ~/documents/notes"
bind P run-shell "~/.config/scripts/tmux-session-dispensary.sh ~/documents/projects"
bind D run-shell "~/.config/scripts/tmux-session-dispensary.sh ~/.config"
bind H run-shell "~/.config/scripts/tmux-session-dispensary.sh ~"
bind S run-shell "~/.config/scripts/tmux-session-dispensary.sh ~/documents/projects/stormy"

bind G new-window -n "git" -S lazygit
bind o new-window -S -n "BOOKMARKS" "nvim ~/bookmarks.csv"
bind e new-window -S "nvim ~/bookmarks.csv"
bind E show-environment -g

##### Copy-mode (vi) + clipboard (macOS/Linux) #####
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy 2>/dev/null || xclip -selection clipboard 2>/dev/null || wl-copy"

set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[ q'
